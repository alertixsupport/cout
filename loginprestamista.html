<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Acceso Prestamistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #090a0f;
      --bg-surface: #12151f;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #2563eb;
      --accent-primary: #2563eb;
      --accent-flame: #f97316;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 50% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(249, 115, 22, 0.05) 0px, transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text-primary);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.4)); }
      50% { transform: scale(1.06) rotate(-2deg); filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.7)); }
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-align: center;
    }

    .brand-logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: flameFlicker 3s ease-in-out infinite;
    }

    .brand-logo-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-flame);
      fill: none;
      stroke-width: 2;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-flame);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      line-height: 1.4;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .input-icon-group {
      position: relative;
      width: 100%;
    }

    .input-icon-group svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-tertiary);
      fill: none;
      stroke-width: 2;
    }

    .input-icon-group input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 42px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-icon-group input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Animación de carga profesional (Spinner) */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-banner {
      width: 100%;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fca5a5;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    /* Enlace de Renovación */
    .renovar-container {
      margin-top: 20px;
      text-align: center;
    }

    .renovar-link {
      font-size: 12px;
      color: var(--accent-flame);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .renovar-link:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo-icon" title="Cout.app">
        <svg viewBox="0 0 24 24">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.542 2-6 .5 2 2 3.5 3.5 5.5A5.5 5.5 0 0 1 17 15a5 5 0 0 1-10 0c0-.3.033-.6.097-.892A5.474 5.474 0 0 0 8.5 14.5z"/>
          <path d="M12 22a4 4 0 0 0 4-4c0-1.5-1-2.5-2-3.5-.5 1-1 1.5-2 2s-1.5-.5-2-1.5c-1 1-2 2-2 3a4 4 0 0 0 4 4z"/>
        </svg>
      </div>
      <div>
        <h1 class="logo-text">cout<span>.app</span></h1>
        <p class="brand-subtitle">Software para gestión empresarial de prestamistas</p>
      </div>
    </div>

    <div class="error-banner" id="errorBanner"></div>

    <form class="login-form" id="loginForm">
      <div class="form-field">
        <label for="usuario">Usuario</label>
        <div class="input-icon-group">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" id="usuario" required autocomplete="username" placeholder="Ingrese su usuario">
        </div>
      </div>

      <div class="form-field">
        <label for="clave">Contraseña de acceso</label>
        <div class="input-icon-group">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="clave" required autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span id="btnText">Iniciar sesión</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>
    </form>

    <div class="renovar-container">
      <a href="pagosonline.html" class="renovar-link">¿Necesitas renovar usuario? Click aquí</a>
    </div>

    <div class="login-footer">
      COUT.APP &bull; Seguridad Financiera
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const loginForm = document.getElementById('loginForm');
    const usuarioInput = document.getElementById('usuario');
    const claveInput = document.getElementById('clave');
    const errorBanner = document.getElementById('errorBanner');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    function mostrarError(mensaje) {
      errorBanner.textContent = mensaje;
      errorBanner.style.display = 'block';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';

      const usuarioVal = usuarioInput.value.trim();
      const claveVal = claveInput.value.trim();

      if (!usuarioVal || !claveVal) {
        mostrarError("Por favor, complete todos los campos.");
        return;
      }

      // Activar animación de carga profesional
      btnText.textContent = "Verificando acceso...";
      btnSpinner.style.display = "block";
      btnSubmit.disabled = true;

      try {
        // Consulta directa a la ruta exacta en Firestore
        const usuariosRef = collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas");
        const snapshot = await getDocs(usuariosRef);

        let prestamistaEncontrado = null;

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          // Compara si el documento coincide o si los campos de usuario y clave son correctos
          if (
            (docSnap.id === usuarioVal || data.usuario === usuarioVal || data.username === usuarioVal) &&
            (data.clave === claveVal || data.password === claveVal)
          ) {
            prestamistaEncontrado = { id: docSnap.id, ...data };
          }
        });

        if (!prestamistaEncontrado) {
          mostrarError("Usuario o contraseña incorrectos.");
          btnText.textContent = "Iniciar sesión";
          btnSpinner.style.display = "none";
          btnSubmit.disabled = false;
          return;
        }

        // Validación opcional de suscripción vencida (comprobando el campo venceEn)
        if (prestamistaEncontrado.venceEn) {
          const hoy = new Date();
          hoy.setHours(0, 0, 0, 0);
          const fVence = new Date(prestamistaEncontrado.venceEn);
          fVence.setHours(0, 0, 0, 0);

          if (!isNaN(fVence.getTime()) && fVence < hoy) {
            mostrarError("Su suscripción se encuentra vencida. Por favor renueve su usuario.");
            btnText.textContent = "Iniciar sesión";
            btnSpinner.style.display = "none";
            btnSubmit.disabled = false;
            return;
          }
        }

        // Guardamos la sesión en localStorage para que gestionprestamista.html lo reconozca al instante
        localStorage.setItem('cout_prestamista_id', prestamistaEncontrado.id);
        localStorage.setItem('cout_prestamista_user', prestamistaEncontrado.usuario || prestamistaEncontrado.username || usuarioVal);

        // Redirección exitosa a gestionprestamista.html (con parámetro opcional en URL por seguridad)
        setTimeout(() => {
          window.location.replace(`gestionprestamista.html?user=${encodeURIComponent(prestamistaEncontrado.id)}`);
        }, 400);

      } catch (err) {
        console.error("Error al conectar con Firebase:", err);
        mostrarError("Error de conexión con el servidor. Intente nuevamente.");
        btnText.textContent = "Iniciar sesión";
        btnSpinner.style.display = "none";
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
