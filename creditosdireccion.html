<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Dirección de Créditos y Cobros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    html, body { width: 100%; min-height: 100vh; background-color: var(--bg-base); color: var(--text-primary); overflow-x: hidden; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }

    header {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 14px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle); color: var(--text-secondary); text-decoration: none;
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border-color: rgba(249, 115, 22, 0.3); }
    .btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .brand-section { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 20px; font-weight: 800; color: var(--text-primary); }
    .logo-text span { color: var(--accent-flame); }

    .dashboard-hero { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .hero-text h1 { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
    .hero-text h1 span { color: var(--accent-flame); }
    .hero-text p { font-size: 13px; color: var(--text-secondary); }

    .search-container { margin-bottom: 20px; width: 100%; }
    .search-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    @media (min-width: 768px) { .search-input-wrapper { max-width: 380px; } }
    .search-input-wrapper svg.search-icon { position: absolute; left: 14px; width: 15px; height: 15px; stroke: var(--text-tertiary); fill: none; stroke-width: 2; pointer-events: none; }
    .search-input-wrapper input {
      width: 100%; padding: 10px 14px 10px 38px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 10px; color: var(--text-primary); font-size: 13px; outline: none; transition: all 0.25s ease;
    }
    .search-input-wrapper input:focus { border-color: var(--accent-flame); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }

    .direction-list { display: flex; flex-direction: column; gap: 14px; }
    .direction-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .client-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .dni-tag { font-size: 11px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border-subtle); }
    
    .financial-progress-bar { width: 100%; height: 6px; background: #090e18; border-radius: 3px; overflow: hidden; border: 1px solid var(--border-subtle); }
    .financial-progress-fill { height: 100%; background: linear-gradient(90deg, #ea580c, #f97316); border-radius: 3px; transition: width 0.3s ease; }

    .cuotas-mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .cuota-box {
      background: #090e18; border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px; justify-content: space-between;
    }
    .cuota-box-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .cuota-box-body { font-size: 11px; color: var(--text-secondary); }
    
    .btn-abonar-rapido {
      width: 100%; height: 32px; background: rgba(249, 115, 22, 0.15); border: 1px solid rgba(249, 115, 22, 0.4);
      border-radius: 8px; color: var(--accent-flame); font-size: 11px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s;
    }
    .btn-abonar-rapido:hover { background: rgba(249, 115, 22, 0.3); }

    /* Modal de Abono Rápido */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 7, 11, 0.85); backdrop-filter: blur(12px);
      z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
    .modal-container { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .btn-close-modal { background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

    .payment-form { display: flex; flex-direction: column; gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
    .form-field input, .form-field textarea { width: 100%; padding: 10px; background: #090e18; border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary); font-size: 13px; outline: none; }
    .btn-confirm-pay { width: 100%; height: 40px; background: var(--accent-flame); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px; }

    .custom-alert-overlay { position: fixed; inset: 0; background: rgba(5, 7, 11, 0.88); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .custom-alert-overlay.is-open { opacity: 1; pointer-events: auto; }
    .custom-alert-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; width: 100%; max-width: 380px; padding: 22px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
    .custom-alert-box h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .custom-alert-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .btn-alert-primary { width: 100%; height: 40px; background: var(--accent-flame); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <h4 id="alertTitle">Atención</h4>
      <p id="alertMessage">...</p>
      <button class="btn-alert-primary" id="alertOkBtn">Aceptar</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>
      <div class="brand-section"><h1 class="logo-text">cout<span>.app</span></h1></div>
    </header>

    <main>
      <div class="dashboard-hero">
        <div class="hero-text">
          <h1>Dirección de <span>Créditos y Cobros</span></h1>
          <p>Gestión directa de pagos y descuento de saldos por cuota en tiempo real.</p>
        </div>
      </div>

      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar por cliente o DNI...">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <div class="direction-list" id="directionList"></div>
    </main>
  </div>

  <!-- MODAL ABONO RÁPIDO -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalPaymentTitle">Abonar Cuota</h3>
        <button class="btn-close-modal" id="closeModalBtn">✕</button>
      </div>
      <div class="payment-form">
        <div class="form-field">
          <label>Monto en Pesos a Abonar ($)</label>
          <input type="number" id="montoInput" step="any" placeholder="Ej. 5000">
        </div>
        <div class="form-field">
          <label>Nota / Detalle</label>
          <textarea id="notaInput" rows="2" placeholder="Ej. Cobro en efectivo en domicilio..."></textarea>
        </div>
        <button class="btn-confirm-pay" id="confirmPayBtn">Registrar y Descontar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    if (!prestamistaId) window.location.replace('loginprestamista.html');

    let creditosCache = [];
    let clientesCache = {};

    window.mostrarAlerta = (t, m) => {
      document.getElementById('alertTitle').textContent = t;
      document.getElementById('alertMessage').textContent = m;
      document.getElementById('customAlertOverlay').classList.add('is-open');
    };
    document.getElementById('alertOkBtn').onclick = () => document.getElementById('customAlertOverlay').classList.remove('is-open');

    // Cargar clientes para DNI
    const cacheCli = localStorage.getItem(`cout_clientes_cache_${prestamistaId}`);
    if (cacheCli) {
      try { JSON.parse(cacheCli).forEach(c => clientesCache[c.id] = c); } catch(e) {}
    }

    const modal = document.getElementById('paymentModal');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('is-open');

    let activeCreditoId = null;
    let activeCuotaIndex = null;

    window.abrirAbono = (creditoId, cuotaIndex, restante) => {
      activeCreditoId = creditoId;
      activeCuotaIndex = cuotaIndex;
      document.getElementById('montoInput').value = restante;
      document.getElementById('notaInput').value = '';
      modal.classList.add('is-open');
    };

    document.getElementById('confirmPayBtn').onclick = async () => {
      const monto = parseFloat(document.getElementById('montoInput').value) || 0;
      const nota = document.getElementById('notaInput').value.trim() || 'Cobro directo';
      if (monto <= 0) return;

      const c = creditosCache.find(item => item.id === activeCreditoId);
      if (!c) return;

      let cuotas = JSON.parse(JSON.stringify(c.cuotasDetalle || []));
      let cuota = cuotas[activeCuotaIndex];
      let pagadoActual = (cuota.pagado || 0) + monto;

      if (pagadoActual >= cuota.monto) {
        cuota.pagado = cuota.monto;
        cuota.estado = 'pagada';
      } else {
        cuota.pagado = pagadoActual;
        cuota.estado = 'parcial';
      }

      const auditoria = c.auditoria || [];
      auditoria.unshift({
        fecha: new Date().toISOString(),
        descripcion: `[Dirección de Cobros] Abono de $${monto.toLocaleString('es-AR')} en Cuota #${cuota.numero}. Detalle: ${nota}`
      });

      try {
        await updateDoc(doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos", activeCreditoId), {
          cuotasDetalle: cuotas,
          auditoria
        });
        modal.classList.remove('is-open');
        mostrarAlerta("Éxito", "Pago registrado y descontado del crédito correctamente.");
      } catch(err) {
        console.error(err);
        mostrarAlerta("Error", "No se pudo registrar el pago.");
      }
    };

    function renderDirection(arr) {
      const list = document.getElementById('directionList');
      list.innerHTML = '';
      if (arr.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-tertiary); padding:40px;">No hay créditos activos para direccionar.</div>';
        return;
      }

      arr.forEach(c => {
        const dni = (clientesCache[c.clienteId] || {}).dni || 'N/D';
        const cuotas = c.cuotasDetalle || [];
        
        let totalMonto = c.totalConInteres || 0;
        let totalPagadoAcumulado = cuotas.reduce((acc, q) => acc + (q.pagado || 0), 1) - 1;
        let porcentajeProgreso = Math.min(100, Math.round((totalPagadoAcumulado / totalMonto) * 100)) || 0;

        let cuotasHtml = '';
        cuotas.forEach((q, idx) => {
          const restante = q.monto - (q.pagado || 0);
          cuotasHtml += `
            <div class="cuota-box">
              <div class="cuota-box-header">
                <span>Cuota #${q.numero}</span>
                <span style="color:${q.estado === 'pagada' ? 'var(--status-success)' : 'var(--accent-flame)'};">${q.estado.toUpperCase()}</span>
              </div>
              <div class="cuota-box-body">
                <div>Total: $${q.monto.toLocaleString('es-AR', {minimumFractionDigits:2})}</div>
                <div>Restante: $${restante.toLocaleString('es-AR', {minimumFractionDigits:2})}</div>
              </div>
              ${q.estado !== 'pagada' ? `<button class="btn-abonar-rapido" onclick="window.abrirAbono('${c.id}', ${idx}, ${restante})">Abonar $</button>` : '<div style="font-size:10px; color:var(--status-success); font-weight:700; text-align:center;">PAGADA ✔</div>'}
            </div>
          `;
        });

        list.innerHTML += `
          <div class="direction-card">
            <div class="card-top">
              <div class="client-info">
                <h3>${c.clienteNombre}</h3>
                <span class="dni-tag">DNI: ${dni} | Estado: <strong style="text-transform:uppercase;">${c.estado || 'activo'}</strong></span>
              </div>
              <div style="text-align:right;">
                <span style="font-size:11px; color:var(--text-secondary);">Progreso General</span>
                <div style="font-size:14px; font-weight:800; font-family:'JetBrains Mono';">${porcentajeProgreso}%</div>
              </div>
            </div>
            <div class="financial-progress-bar">
              <div class="financial-progress-fill" style="width: ${porcentajeProgreso}%;"></div>
            </div>
            <div class="cuotas-mini-grid">
              ${cuotasHtml}
            </div>
          </div>
        `;
      });
    }

    document.getElementById('searchInput').oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderDirection(creditosCache); return; }
      renderDirection(creditosCache.filter(c => c.clienteNombre.toLowerCase().includes(q) || ((clientesCache[c.clienteId]||{}).dni||'').toLowerCase().includes(q)));
    };

    onSnapshot(collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos"), snap => {
      creditosCache = [];
      snap.forEach(d => creditosCache.push({ id: d.id, ...d.data() }));
      renderDirection(creditosCache);
    });
  </script>
</body>
</html>
