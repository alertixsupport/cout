<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Dirección y Fichas de Crédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    html, body { width: 100%; min-height: 100vh; background-color: var(--bg-base); color: var(--text-primary); overflow-x: hidden; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; width: 100%; }

    header {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px;
      padding: 14px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle); color: var(--text-secondary); text-decoration: none;
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px; transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border-color: rgba(249, 115, 22, 0.3); }
    .btn-back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .brand-section { display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 20px; font-weight: 800; color: var(--text-primary); }
    .logo-text span { color: var(--accent-flame); }

    .dashboard-hero { margin-bottom: 20px; }
    .hero-text h1 { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
    .hero-text h1 span { color: var(--accent-flame); }
    .hero-text p { font-size: 13px; color: var(--text-secondary); }

    .search-container { margin-bottom: 24px; width: 100%; }
    .search-input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
    .search-input-wrapper svg.search-icon { position: absolute; left: 14px; width: 15px; height: 15px; stroke: var(--text-tertiary); fill: none; stroke-width: 2; pointer-events: none; }
    .search-input-wrapper input {
      width: 100%; padding: 11px 14px 11px 38px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 12px; color: var(--text-primary); font-size: 13px; outline: none; transition: all 0.25s ease;
    }
    .search-input-wrapper input:focus { border-color: var(--accent-flame); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }

    /* Ficha Completa del Crédito */
    .credit-ficha-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px;
      padding: 24px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .ficha-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px; }
    .ficha-client-title h2 { font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
    .ficha-meta-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .meta-tag { font-size: 11px; font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); padding: 3px 8px; border-radius: 6px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    
    .btn-copy-id {
      background: none; border: none; cursor: pointer; color: var(--accent-flame); padding: 0; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.1s;
    }
    .btn-copy-id:hover { transform: scale(1.1); }
    .btn-copy-id svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

    .ficha-grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #090e18; border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px; }
    .info-box { display: flex; flex-direction: column; gap: 3px; }
    .info-box .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-tertiary); }
    .info-box .val { font-size: 13px; font-weight: 700; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }

    /* Sección de Cuotas Detalladas */
    .cuotas-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
    .cuotas-direccion-list { display: flex; flex-direction: column; gap: 10px; }
    .cuota-direccion-row {
      background: #090e18; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 14px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .cuota-detalles { display: flex; flex-direction: column; gap: 3px; }
    .cuota-detalles .num { font-size: 14px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: var(--text-primary); }
    .cuota-detalles .sub { font-size: 12px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }

    .cuota-actions-right { display: flex; align-items: center; gap: 12px; }
    .estado-tag { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; }
    .estado-tag.pagada { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .estado-tag.parcial { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .estado-tag.pendiente { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }

    .btn-registrar-pago {
      background: var(--accent-flame); border: none; color: white; font-size: 12px; font-weight: 700;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-registrar-pago:hover { opacity: 0.85; }

    /* Modal Registrar Pago */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 7, 11, 0.85); backdrop-filter: blur(12px);
      z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
    .modal-container { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .btn-close-modal { background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle); color: var(--text-secondary); cursor: pointer; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

    .payment-form { display: flex; flex-direction: column; gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
    .form-field input, .form-field textarea { width: 100%; padding: 10px; background: #090e18; border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-primary); font-size: 13px; outline: none; }
    .btn-confirm-pay { width: 100%; height: 42px; background: var(--accent-flame); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 6px; }
    .btn-confirm-pay:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Alerta Custom */
    .custom-alert-overlay { position: fixed; inset: 0; background: rgba(5, 7, 11, 0.88); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .custom-alert-overlay.is-open { opacity: 1; pointer-events: auto; }
    .custom-alert-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; width: 100%; max-width: 380px; padding: 22px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
    .custom-alert-box h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .custom-alert-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
    .btn-alert-primary { width: 100%; height: 40px; background: var(--accent-flame); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <h4 id="alertTitle">Atención</h4>
      <p id="alertMessage">...</p>
      <button class="btn-alert-primary" id="alertOkBtn">Aceptar</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>
      <div class="brand-section"><h1 class="logo-text">cout<span>.app</span></h1></div>
    </header>

    <main>
      <div class="dashboard-hero">
        <div class="hero-text">
          <h1>Dirección y Fichas de <span>Crédito</span></h1>
          <p>Visualice la ficha exacta de cada crédito, copie su ID único y registre abonos con auditoría y descuento automático desde la base de datos.</p>
        </div>
      </div>

      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar crédito por nombre de cliente, DNI o ID...">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <div id="fichasContainer"></div>
    </main>
  </div>

  <!-- MODAL: REGISTRAR PAGO A CUOTA -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalPaymentTitle">Registrar Pago de Cuota</h3>
        <button class="btn-close-modal" id="closeModalBtn">✕</button>
      </div>
      <div class="payment-form">
        <div class="form-field">
          <label>Monto en Pesos a Abonar ($)</label>
          <input type="number" id="montoInput" step="any" placeholder="Ej. 5000">
        </div>
        <div class="form-field">
          <label>Nota / Detalle del Pago (Auditoría)</label>
          <textarea id="notaInput" rows="2" placeholder="Ej. Cobro en efectivo, transferencia..."></textarea>
        </div>
        <button class="btn-confirm-pay" id="confirmPayBtn">Confirmar y Descontar del Crédito</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, doc, updateDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    if (!prestamistaId) window.location.replace('loginprestamista.html');

    let creditosCache = [];
    let clientesCache = {};

    window.mostrarAlerta = (t, m) => {
      document.getElementById('alertTitle').textContent = t;
      document.getElementById('alertMessage').textContent = m;
      document.getElementById('customAlertOverlay').classList.add('is-open');
    };
    document.getElementById('alertOkBtn').onclick = () => document.getElementById('customAlertOverlay').classList.remove('is-open');

    // Carga robusta de clientes directamente desde la base de datos (Firestore) en tiempo real
    async function sincronizarClientesFirestore() {
      try {
        const clientesRef = collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "clientes");
        const snap = await getDocs(clientesRef);
        clientesCache = {};
        snap.forEach(d => {
          clientesCache[d.id] = { id: d.id, ...d.data() };
        });
        // Actualizamos también el caché local para respaldar
        localStorage.setItem(`cout_clientes_cache_${prestamistaId}`, JSON.stringify(Object.values(clientesCache)));
      } catch(err) {
        console.error("Error al obtener los clientes de la base de datos:", err);
        // Respaldo secundario con localStorage si falla la red momentáneamente
        const cacheCli = localStorage.getItem(`cout_clientes_cache_${prestamistaId}`);
        if (cacheCli) {
          try { JSON.parse(cacheCli).forEach(c => clientesCache[c.id] = c); } catch(e) {}
        }
      }
    }

    const modal = document.getElementById('paymentModal');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('is-open');

    let activeCreditoId = null;
    let activeCuotaIndex = null;

    window.abrirModalPago = (creditoId, cuotaIndex, restante) => {
      activeCreditoId = creditoId;
      activeCuotaIndex = cuotaIndex;
      document.getElementById('montoInput').value = restante;
      document.getElementById('notaInput').value = '';
      document.getElementById('modalPaymentTitle').textContent = `Registrar Pago - Cuota #${cuotaIndex + 1}`;
      modal.classList.add('is-open');
    };

    window.copiarIdCredito = (idUnico) => {
      navigator.clipboard.writeText(idUnico).then(() => {
        window.mostrarAlerta("Copiado", `ID del crédito (${idUnico}) copiado al portapapeles.`);
      });
    };

    // GUARDAR PAGO CON AUDITORÍA ABSOLUTA EN FIRESTORE
    document.getElementById('confirmPayBtn').onclick = async () => {
      const confirmBtn = document.getElementById('confirmPayBtn');
      const montoAbonado = parseFloat(document.getElementById('montoInput').value) || 0;
      const nota = document.getElementById('notaInput').value.trim() || 'Abono registrado desde Dirección';
      
      if (montoAbonado <= 0) {
        window.mostrarAlerta("Monto inválido", "Por favor, ingresa un monto mayor a 0.");
        return;
      }

      const c = creditosCache.find(item => item.id === activeCreditoId);
      if (!c) {
        window.mostrarAlerta("Error", "No se encontró el registro del crédito.");
        return;
      }

      confirmBtn.disabled = true;
      confirmBtn.textContent = "Guardando en Firestore...";

      let cuotasArr = c.cuotasDetalle ? JSON.parse(JSON.stringify(c.cuotasDetalle)) : [];
      if (cuotasArr.length === 0) {
        const valorCuota = c.valorCuota || (c.totalConInteres / c.cantidadCuotas);
        let fechaBase = new Date(c.fechaInicio || Date.now());
        for (let i = 1; i <= c.cantidadCuotas; i++) {
          if (c.frecuencia === 'semanal') fechaBase.setDate(fechaBase.getDate() + 7);
          else if (c.frecuencia === 'quincenal') fechaBase.setDate(fechaBase.getDate() + 15);
          else if (c.frecuencia === 'mensual') fechaBase.setMonth(fechaBase.getMonth() + 1);

          cuotasArr.push({
            numero: i,
            vencimiento: fechaBase.toISOString().split('T')[0],
            monto: valorCuota,
            pagado: 0,
            estado: 'pendiente'
          });
        }
      }

      let cuota = cuotasArr[activeCuotaIndex];
      let pagadoActual = (cuota.pagado || 0) + montoAbonado;

      if (pagadoActual >= cuota.monto) {
        cuota.pagado = cuota.monto;
        cuota.estado = 'pagada';
      } else {
        cuota.pagado = pagadoActual;
        cuota.estado = 'parcial';
      }

      // Auditoría exacta guardada en base de datos
      const fechaHoraActual = new Date().toISOString();
      const auditoria = c.auditoria || [];
      auditoria.unshift({
        fecha: fechaHoraActual,
        descripcion: `[Dirección de Pagos] Abono de $${montoAbonado.toLocaleString('es-AR')} aplicado a la Cuota #${cuota.numero}. Detalle: ${nota}`
      });

      try {
        const docRef = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos", activeCreditoId);
        await updateDoc(docRef, {
          cuotasDetalle: cuotasArr,
          auditoria: auditoria
        });
        
        modal.classList.remove('is-open');
        window.mostrarAlerta("¡Éxito!", `Pago de $${montoAbonado.toLocaleString('es-AR')} registrado y descontado correctamente.`);
      } catch(err) {
        console.error("Error al guardar en Firestore:", err);
        window.mostrarAlerta("Error al guardar", "No se pudo actualizar el pago en la base de datos.");
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.textContent = "Confirmar y Descontar del Crédito";
      }
    };

    function renderFichas(arr) {
      const container = document.getElementById('fichasContainer');
      container.innerHTML = '';

      if (!arr || arr.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 40px; font-size: 13px;">No hay fichas de créditos disponibles.</div>';
        return;
      }

      arr.forEach(c => {
        const clienteInfo = clientesCache[c.clienteId] || {};
        const dniCliente = clienteInfo.dni || c.clienteDni || 'N/D';
        const estadoCredito = c.estado || 'activo';
        
        // ID único del crédito (ej. #CRED-1900 o basado en su identificador)
        const creditIdTag = c.codigoUnico || `#CRED-${c.id.substring(0, 6).toUpperCase()}`;

        let cuotasArr = c.cuotasDetalle || [];
        if (cuotasArr.length === 0) {
          cuotasArr = [];
          const valorCuota = c.valorCuota || (c.totalConInteres / c.cantidadCuotas);
          let fechaBase = new Date(c.fechaInicio || Date.now());
          for (let i = 1; i <= c.cantidadCuotas; i++) {
            if (c.frecuencia === 'semanal') fechaBase.setDate(fechaBase.getDate() + 7);
            else if (c.frecuencia === 'quincenal') fechaBase.setDate(fechaBase.getDate() + 15);
            else if (c.frecuencia === 'mensual') fechaBase.setMonth(fechaBase.getMonth() + 1);

            cuotasArr.push({
              numero: i,
              vencimiento: fechaBase.toISOString().split('T')[0],
              monto: valorCuota,
              pagado: 0,
              estado: 'pendiente'
            });
          }
        }

        let cuotasHtml = '';
        cuotasArr.forEach((cuota, index) => {
          const pagado = cuota.pagado || 0;
          const restante = cuota.monto - pagado;
          const estadoCls = cuota.estado === 'pagada' ? 'pagada' : (cuota.estado === 'parcial' ? 'parcial' : 'pendiente');

          cuotasHtml += `
            <div class="cuota-direccion-row">
              <div class="cuota-detalles">
                <span class="num">Cuota #${cuota.numero} — Total: $${cuota.monto.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
                <span class="sub">Vence: ${cuota.vencimiento} | Pagado: $${pagado.toLocaleString('es-AR', {minimumFractionDigits: 2})} | Restante: <strong style="color:var(--accent-flame);">$${restante.toLocaleString('es-AR', {minimumFractionDigits: 2})}</strong></span>
              </div>
              <div class="cuota-actions-right">
                <span class="estado-tag ${estadoCls}">${cuota.estado.toUpperCase()}</span>
                ${cuota.estado !== 'pagada' ? `<button class="btn-registrar-pago" onclick="window.abrirModalPago('${c.id}', ${index}, ${restante})">Registrar Pago</button>` : '<span style="font-size:11px; font-weight:700; color:var(--status-success);">PAGADA ✔</span>'}
              </div>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="credit-ficha-card">
            <div class="ficha-header">
              <div class="ficha-client-title">
                <h2>${c.clienteNombre || 'Cliente'}</h2>
                <div class="ficha-meta-tags">
                  <span class="meta-tag">
                    ID: <strong>${creditIdTag}</strong>
                    <button class="btn-copy-id" onclick="window.copiarIdCredito('${creditIdTag}')" title="Copiar ID de Crédito">
                      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                  </span>
                  <span class="meta-tag">DNI: ${dniCliente}</span>
                  <span class="meta-tag">Tipo: ${c.tipoCredito || 'Efectivo'}</span>
                  <span class="meta-tag" style="text-transform: uppercase; color: var(--accent-flame);">Estado: ${estadoCredito}</span>
                </div>
              </div>
            </div>

            <div class="ficha-grid-info">
              <div class="info-box"><span class="lbl">Monto Total con Interés</span><span class="val">$${(c.totalConInteres || 0).toLocaleString('es-AR')}</span></div>
              <div class="info-box"><span class="lbl">Frecuencia</span><span class="val" style="text-transform:uppercase;">${c.frecuencia || 'N/D'}</span></div>
              <div class="info-box"><span class="lbl">Cantidad de Cuotas</span><span class="val">${c.cantidadCuotas} cuota(s)</span></div>
            </div>

            <div>
              <div class="cuotas-section-title">Cronograma de Cuotas y Descuento de Pagos</div>
              <div class="cuotas-direccion-list">
                ${cuotasHtml}
              </div>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('searchInput').oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderFichas(creditosCache); return; }
      renderFichas(creditosCache.filter(c => {
        const dni = (clientesCache[c.clienteId] || {}).dni || c.clienteDni || '';
        const idTag = `#CRED-${c.id.substring(0, 6)}`.toLowerCase();
        return (c.clienteNombre || '').toLowerCase().includes(q) || dni.toLowerCase().includes(q) || idTag.includes(q);
      }));
    };

    // Inicializar sincronización con la base de datos de Firestore y escuchar cambios de créditos
    sincronizarClientesFirestore().then(() => {
      onSnapshot(collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos"), snap => {
        creditosCache = [];
        snap.forEach(d => creditosCache.push({ id: d.id, ...d.data() }));
        renderFichas(creditosCache);
      });
    });
  </script>
