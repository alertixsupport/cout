<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Configuración de Menú Dinámico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-primary: #2563eb;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-error: #ef4444;
      --status-success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
    }

    /* Navbar Principal */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-flame);
    }

    /* Panel Hero */
    .dashboard-hero {
      margin-bottom: 24px;
    }

    .dashboard-hero h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .dashboard-hero h1 span {
      color: var(--accent-flame);
    }

    .dashboard-hero p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Layout en Grid */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .admin-grid {
        grid-template-columns: 1fr 1.3fr;
      }
    }

    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-panel h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Formulario */
    .menu-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 12px 14px;
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    .form-actions-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    @keyframes buttonAmbientOrange {
      0%, 100% { box-shadow: 0 0 15px rgba(249, 115, 22, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
    }

    .btn-submit {
      flex: 1;
      height: 48px;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      border: 1px solid rgba(249, 115, 22, 0.6);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: buttonAmbientOrange 3.5s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(249, 115, 22, 0.45);
    }

    .btn-cancel-edit {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel-edit:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    /* Lista agrupada por categorías */
    .menu-grouped-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .category-group-block {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-flame);
      padding-left: 4px;
    }

    .menu-item-row {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .menu-item-row:hover {
      border-color: rgba(249, 115, 22, 0.3);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .item-svg-preview {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-svg-preview svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent-flame);
      fill: none;
      stroke-width: 2;
    }

    .item-details {
      min-width: 0;
    }

    .item-details h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-details .meta-text {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-action.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-action svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .status-msg {
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }

    .status-msg.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>

      <div class="brand-section">
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>
    </header>

    <main>
      <div class="dashboard-hero">
        <h1>Gestión de Menú <span>Dinámico</span></h1>
        <p>Organice por categorías, reubique el orden vertical y edite las páginas del menú lateral.</p>
      </div>

      <div class="admin-grid">
        
        <!-- FORMULARIO DE CREACIÓN / EDICIÓN -->
        <div class="card-panel">
          <h2 id="formTitle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nuevo Ítem de Menú
          </h2>

          <div class="status-msg success" id="successMsg" style="display: none;">¡Cambios guardados con éxito!</div>

          <form class="menu-form" id="menuForm">
            <input type="hidden" id="editDocId" value="">

            <div class="form-field">
              <label for="nombre">Título del Menú</label>
              <input type="text" id="nombre" required placeholder="Ej. Clientes o Testimonios">
            </div>

            <div class="form-field">
              <label for="redireccion">Redirección (Link / Archivo)</label>
              <input type="text" id="redireccion" required placeholder="Ej. testimonio.html">
            </div>

            <div class="form-field">
              <label for="categoria">Categoría</label>
              <input type="text" id="categoria" required placeholder="Ej. Operativo, Finanzas">
            </div>

            <div class="form-field">
              <label for="logotipo">Código Ícono SVG (completo)</label>
              <textarea id="logotipo" required placeholder='<svg viewBox="0 0 24 24"><path d="..."/></svg>'></textarea>
            </div>

            <div class="form-actions-row">
              <button type="button" class="btn-cancel-edit" id="cancelEditBtn">Cancelar</button>
              <button type="submit" class="btn-submit" id="submitBtn">
                <span id="submitBtnTxt">Guardar Ítem</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </button>
            </div>
          </form>
        </div>

        <!-- LISTA AGRUPADA Y REUBICABLE -->
        <div class="card-panel">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Ítems por Categoría y Orden
          </h2>

          <div class="menu-grouped-container" id="menuGroupedContainer">
            <div style="text-align: center; color: var(--text-tertiary); padding: 30px; font-size: 13px;">
              Cargando estructura desde Firebase...
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    if (!prestamistaId) {
      window.location.replace('loginprestamista.html');
    }

    const menuForm = document.getElementById('menuForm');
    const editDocIdInput = document.getElementById('editDocId');
    const nombreInput = document.getElementById('nombre');
    const redireccionInput = document.getElementById('redireccion');
    const categoriaInput = document.getElementById('categoria');
    const logotipoInput = document.getElementById('logotipo');
    const successMsg = document.getElementById('successMsg');
    const menuGroupedContainer = document.getElementById('menuGroupedContainer');
    const formTitle = document.getElementById('formTitle');
    const submitBtnTxt = document.getElementById('submitBtnTxt');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    let menuCacheGlobal = [];

    // 1. Guardar o Actualizar Ítem
    menuForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const docId = editDocIdInput.value;
      const dataItem = {
        Nombre: nombreInput.value.trim(),
        Redireccion: redireccionInput.value.trim(),
        Categoria: categoriaInput.value.trim(),
        LOGOTIPO: logotipoInput.value.trim()
      };

      try {
        const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");

        if (docId) {
          // Actualizar existente
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", docId);
          await updateDoc(docRef, dataItem);
        } else {
          // Crear nuevo con orden al final
          dataItem.orden = menuCacheGlobal.length;
          await addDoc(menuRef, dataItem);
        }

        localStorage.removeItem('cout_menu_cache');
        resetearFormulario();

        successMsg.style.display = 'block';
        setTimeout(() => { successMsg.style.display = 'none'; }, 3000);

      } catch (err) {
        console.error("Error al guardar:", err);
        alert("Ocurrió un error al guardar el menú.");
      }
    });

    // 2. Cargar datos en formulario para Editar
    window.cargarParaEditar = (id) => {
      const item = menuCacheGlobal.find(m => m.id === id);
      if (!item) return;

      editDocIdInput.value = item.id;
      nombreInput.value = item.Nombre || '';
      redireccionInput.value = item.Redireccion || '';
      categoriaInput.value = item.Categoria || '';
      logotipoInput.value = item.LOGOTIPO || '';

      formTitle.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Editar: ${item.Nombre}`;
      submitBtnTxt.textContent = "Actualizar Ítem";
      cancelEditBtn.style.display = 'block';
      nombreInput.focus();
    };

    function resetearFormulario() {
      menuForm.reset();
      editDocIdInput.value = '';
      formTitle.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Nuevo Ítem de Menú`;
      submitBtnTxt.textContent = "Guardar Ítem";
      cancelEditBtn.style.display = 'none';
    }

    cancelEditBtn.addEventListener('click', resetearFormulario);

    // 3. Eliminar ítem
    window.eliminarItemMenu = async (id) => {
      if (confirm("¿Está seguro de eliminar este ítem del menú?")) {
        try {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", id);
          await deleteDoc(docRef);
          localStorage.removeItem('cout_menu_cache');
        } catch (err) {
          console.error("Error al eliminar:", err);
        }
      }
    };

    // 4. Reubicar posición (Subir o Bajar)
    window.cambiarPosicion = async (id, direccion) => {
      const index = menuCacheGlobal.findIndex(m => m.id === id);
      if (index === -1) return;

      const nuevoIndex = index + direccion;
      if (nuevoIndex < 0 || nuevoIndex >= menuCacheGlobal.length) return;

      // Intercambiar órdenes en memoria
      const temp = menuCacheGlobal[index];
      menuCacheGlobal[index] = menuCacheGlobal[nuevoIndex];
      menuCacheGlobal[nuevoIndex] = temp;

      try {
        // Actualizar el campo 'orden' en Firestore para todos los afectados
        for (let i = 0; i < menuCacheGlobal.length; i++) {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", menuCacheGlobal[i].id);
          await updateDoc(docRef, { orden: i });
        }
        localStorage.removeItem('cout_menu_cache');
      } catch (err) {
        console.error("Error al reordenar:", err);
      }
    };

    // 5. Escucha en tiempo real y renderizado agrupado
    const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");

    onSnapshot(menuRef, (snapshot) => {
      menuGroupedContainer.innerHTML = '';
      const items = [];

      snapshot.forEach((docSnap) => {
        items.push({ id: docSnap.id, ...docSnap.data() });
      });

      // Ordenar por campo 'orden' si existe
      items.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
      menuCacheGlobal = items;

      if (items.length === 0) {
        menuGroupedContainer.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 30px; font-size: 13px;">No hay ítems registrados.</div>';
        return;
      }

      // Agrupar por Categoría
      const categoriasMap = {};
      items.forEach((item) => {
        const cat = item.Categoria || item.categoria || 'General';
        if (!categoriasMap[cat]) categoriasMap[cat] = [];
        categoriasMap[cat].push(item);
      });

      Object.keys(categoriasMap).forEach((catName) => {
        const groupBlock = document.createElement('div');
        groupBlock.className = 'category-group-block';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'category-group-title';
        groupTitle.textContent = catName;
        groupBlock.appendChild(groupTitle);

        categoriasMap[catName].forEach((navItem) => {
          const row = document.createElement('div');
          row.className = 'menu-item-row';

          const nombre = navItem.Nombre || navItem.nombre || 'Sin título';
          const redireccion = navItem.Redireccion || navItem.redireccion || '#';
          const svgCode = navItem.LOGOTIPO || navItem.logotipo || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>';

          row.innerHTML = `
            <div class="item-info">
              <div class="item-svg-preview">${svgCode}</div>
              <div class="item-details">
                <h4>${nombre}</h4>
                <div class="meta-text">${redireccion}</div>
              </div>
            </div>
            <div class="item-actions">
              <button class="btn-action" onclick="window.cambiarPosicion('${navItem.id}', -1)" title="Mover arriba">
                <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
              </button>
              <button class="btn-action" onclick="window.cambiarPosicion('${navItem.id}', 1)" title="Mover abajo">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <button class="btn-action" onclick="window.cargarParaEditar('${navItem.id}')" title="Editar ítem">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="btn-action delete" onclick="window.eliminarItemMenu('${navItem.id}')" title="Eliminar ítem">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          `;

          groupBlock.appendChild(row);
        });

        menuGroupedContainer.appendChild(groupBlock);
      });
    });
  </script>
</body>
</html>
