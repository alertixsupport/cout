<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Configuración de Menú Dinámico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-primary: #2563eb;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-error: #ef4444;
      --status-success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
    }

    /* Navbar Principal */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-flame);
    }

    /* Panel Hero */
    .dashboard-hero {
      margin-bottom: 24px;
    }

    .dashboard-hero h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .dashboard-hero h1 span {
      color: var(--accent-flame);
    }

    .dashboard-hero p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Layout en Grid (Formulario + Lista) */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .admin-grid {
        grid-template-columns: 1fr 1.2fr;
      }
    }

    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-panel h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Formulario */
    .menu-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 12px 14px;
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    @keyframes buttonAmbientOrange {
      0%, 100% { box-shadow: 0 0 15px rgba(249, 115, 22, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      border: 1px solid rgba(249, 115, 22, 0.6);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: buttonAmbientOrange 3.5s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(249, 115, 22, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Lista de ítems existentes */
    .menu-items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .menu-item-row {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .menu-item-row:hover {
      border-color: rgba(249, 115, 22, 0.3);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-svg-preview {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-svg-preview svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent-flame);
      fill: none;
      stroke-width: 2;
    }

    .item-details h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .item-details .meta-text {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.25);
      color: white;
    }

    .btn-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .status-msg {
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
      display: none;
    }

    .status-msg.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>

      <div class="brand-section">
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>
    </header>

    <main>
      <div class="dashboard-hero">
        <h1>Gestión de Menú <span>Dinámico</span></h1>
        <p>Agregue o administre las páginas, redirecciones e íconos SVG que aparecerán en el menú lateral de los prestamistas.</p>
      </div>

      <div class="admin-grid">
        
        <!-- FORMULARIO DE CREACIÓN -->
        <div class="card-panel">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nuevo Ítem de Menú
          </h2>

          <div class="status-msg success" id="successMsg" style="display: none;">¡Ítem guardado con éxito!</div>

          <form class="menu-form" id="menuForm">
            <div class="form-field">
              <label for="nombre">Título del Menú</label>
              <input type="text" id="nombre" required placeholder="Ej. Clientes o Testimonios">
            </div>

            <div class="form-field">
              <label for="redireccion">Redirección (Link / Archivo)</label>
              <input type="text" id="redireccion" required placeholder="Ej. testimonio.html o clientes.html">
            </div>

            <div class="form-field">
              <label for="categoria">Categoría</label>
              <input type="text" id="categoria" required placeholder="Ej. Operativo, Finanzas, General">
            </div>

            <div class="form-field">
              <label for="logotipo">Código Ícono SVG (completo)</label>
              <textarea id="logotipo" required placeholder='<svg viewBox="0 0 24 24"><path d="..."/></svg>'></textarea>
            </div>

            <button type="submit" class="btn-submit">
              <span>Guardar en Menuprestamista</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
          </form>
        </div>

        <!-- LISTA DE ÍTEMS EN TIEMPO REAL -->
        <div class="card-panel">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Ítems Activos en la Base de Datos
          </h2>

          <div class="menu-items-list" id="menuItemsList">
            <div style="text-align: center; color: var(--text-tertiary); padding: 30px; font-size: 13px;">
              Cargando ítems desde Firebase...
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { db } from '../app.js';
    import { collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 1. Guardián de autenticación básico
    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    if (!prestamistaId) {
      window.location.replace('loginprestamista.html');
    }

    const menuForm = document.getElementById('menuForm');
    const nombreInput = document.getElementById('nombre');
    const redireccionInput = document.getElementById('redireccion');
    const categoriaInput = document.getElementById('categoria');
    const logotipoInput = document.getElementById('logotipo');
    const successMsg = document.getElementById('successMsg');
    const menuItemsList = document.getElementById('menuItemsList');

    // 2. Guardar nuevo ítem en la colección "menuprestamistas"
    menuForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevoItem = {
        Nombre: nombreInput.value.trim(),
        Redireccion: redireccionInput.value.trim(),
        Categoria: categoriaInput.value.trim(),
        LOGOTIPO: logotipoInput.value.trim()
      };

      try {
        const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");
        await addDoc(menuRef, nuevoItem);

        // Limpiar caché local para forzar actualización inmediata
        localStorage.removeItem('cout_menu_cache');

        menuForm.reset();
        successMsg.style.display = 'block';
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 3000);

      } catch (err) {
        console.error("Error al guardar en menuprestamistas:", err);
        alert("Error al guardar el menú. Intente nuevamente.");
      }
    });

    // 3. Eliminar ítem de la base de datos
    window.eliminarItemMenu = async (docId) => {
      if (confirm("¿Está seguro de eliminar este ítem del menú?")) {
        try {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", docId);
          await deleteDoc(docRef);
          localStorage.removeItem('cout_menu_cache');
        } catch (err) {
          console.error("Error al eliminar:", err);
          alert("No se pudo eliminar el ítem.");
        }
      }
    };

    // 4. Lectura en tiempo real de la colección "menuprestamistas"
    const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");

    onSnapshot(menuRef, (snapshot) => {
      menuItemsList.innerHTML = '';

      if (snapshot.empty) {
        menuItemsList.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 30px; font-size: 13px;">No hay ítems registrados en la base de datos.</div>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;
        const nombre = data.Nombre || data.nombre || 'Sin título';
        const redireccion = data.Redireccion || data.redireccion || '#';
        const categoria = data.Categoria || data.categoria || 'General';
        const svgCode = data.LOGOTIPO || data.logotipo || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>';

        const row = document.createElement('div');
        row.className = 'menu-item-row';

        row.innerHTML = `
          <div class="item-info">
            <div class="item-svg-preview">
              ${svgCode}
            </div>
            <div class="item-details">
              <h4>${nombre}</h4>
              <div class="meta-text">${redireccion} &bull; [${categoria}]</div>
            </div>
          </div>
          <button class="btn-delete" onclick="window.eliminarItemMenu('${id}')" title="Eliminar ítem">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          </button>
        `;

        menuItemsList.appendChild(row);
      });
    });
  </script>
</body>
</html>
