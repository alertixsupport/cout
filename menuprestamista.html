<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Configuración de Menú Dinámico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-primary: #2563eb;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px;
      width: 100%;
    }

    /* Navbar Principal */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-flame);
    }

    /* Panel Hero */
    .dashboard-hero {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-text h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .hero-text h1 span {
      color: var(--accent-flame);
    }

    .hero-text p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    @keyframes buttonAmbientOrange {
      0%, 100% { box-shadow: 0 0 15px rgba(249, 115, 22, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
      50% { box-shadow: 0 0 25px rgba(249, 115, 22, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
    }

    .btn-open-modal {
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      border: 1px solid rgba(249, 115, 22, 0.6);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      animation: buttonAmbientOrange 3.5s ease-in-out infinite;
    }

    .btn-open-modal:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(249, 115, 22, 0.45);
    }

    .btn-open-modal svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
    }

    /* --- VENTANA EMERGENTE (MODAL FLOTANTE) --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.85);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .modal-overlay.is-open .modal-container {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close-modal {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-close-modal:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .btn-close-modal svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    /* Formulario */
    .menu-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 12px 14px;
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-field select {
      cursor: pointer;
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    .btn-submit-modal {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      border: 1px solid rgba(249, 115, 22, 0.6);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-modal:hover {
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
    }

    /* Panel Principal de Listado */
    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-panel h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Contenedor Agrupado */
    .menu-grouped-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .category-group-block {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .category-group-block:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .category-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .category-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-flame);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .category-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .menu-item-row {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .menu-item-row:hover {
      border-color: rgba(249, 115, 22, 0.3);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .item-svg-preview {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item-svg-preview svg {
      width: 16px;
      height: 16px;
      stroke: var(--accent-flame);
      fill: none;
      stroke-width: 2;
    }

    .item-details {
      min-width: 0;
    }

    .item-details h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-details .meta-text {
      font-size: 11px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-action.delete:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-action svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>

      <div class="brand-section">
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>
    </header>

    <main>
      <div class="dashboard-hero">
        <div class="hero-text">
          <h1>Gestión de Menú <span>Dinámico</span></h1>
          <p>Administre páginas, ordene categorías completas o reubique ítems verticalmente.</p>
        </div>
        <button class="btn-open-modal" id="openModalBtn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nueva Página / Menú
        </button>
      </div>

      <!-- LISTA PRINCIPAL AGRUPADA Y REUBICABLE -->
      <div class="card-panel">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Estructura de Categorías y Páginas Activas
        </h2>

        <div class="menu-grouped-container" id="menuGroupedContainer">
          <div style="text-align: center; color: var(--text-tertiary); padding: 40px; font-size: 13px;">
            Cargando estructura en tiempo real...
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- VENTANA EMERGENTE (MODAL) PARA CREAR / EDITAR -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Nueva Página de Menú
        </h3>
        <button class="btn-close-modal" id="closeModalBtn" title="Cerrar ventana">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <form class="menu-form" id="menuForm">
        <input type="hidden" id="editDocId" value="">

        <div class="form-field">
          <label for="nombre">Título del Menú</label>
          <input type="text" id="nombre" required placeholder="Ej. Clientes o Testimonios">
        </div>

        <div class="form-field">
          <label for="redireccion">Redirección (Link / Archivo)</label>
          <input type="text" id="redireccion" required placeholder="Ej. testimonio.html">
        </div>

        <div class="form-field">
          <label for="categoriaSelect">Categoría</label>
          <select id="categoriaSelect">
            <!-- Las opciones se cargan dinámicamente -->
          </select>
        </div>

        <div class="form-field" id="nuevaCategoriaContainer" style="display: none;">
          <label for="categoriaNueva">Escribir Nueva Categoría</label>
          <input type="text" id="categoriaNueva" placeholder="Ej. Operativo, Finanzas">
        </div>

        <div class="form-field">
          <label for="logotipo">Código Ícono SVG (completo)</label>
          <textarea id="logotipo" required placeholder='<svg viewBox="0 0 24 24"><path d="..."/></svg>'></textarea>
        </div>

        <button type="submit" class="btn-submit-modal" id="submitBtnTxt">
          Guardar Página en Menú
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    if (!prestamistaId) {
      window.location.replace('loginprestamista.html');
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const menuForm = document.getElementById('menuForm');
    const editDocIdInput = document.getElementById('editDocId');
    const nombreInput = document.getElementById('nombre');
    const redireccionInput = document.getElementById('redireccion');
    const categoriaSelect = document.getElementById('categoriaSelect');
    const nuevaCategoriaContainer = document.getElementById('nuevaCategoriaContainer');
    const categoriaNuevaInput = document.getElementById('categoriaNueva');
    const logotipoInput = document.getElementById('logotipo');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtnTxt = document.getElementById('submitBtnTxt');
    const menuGroupedContainer = document.getElementById('menuGroupedContainer');

    let menuCacheGlobal = [];

    // Actualizar selector de categorías disponibles
    function actualizarSelectorCategorias(categoriaSeleccionada = '') {
      categoriaSelect.innerHTML = '';
      
      const categoriasUnicas = [];
      menuCacheGlobal.forEach(item => {
        const cat = item.Categoria || item.categoria || 'General';
        if (!categoriasUnicas.includes(cat)) categoriasUnicas.includes(cat) || categoriasUnicas.push(cat);
      });

      categoriasUnicas.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        if (cat === categoriaSeleccionada) opt.selected = true;
        categoriaSelect.appendChild(opt);
      });

      // Opción para agregar nueva categoría
      const optNueva = document.createElement('option');
      optNueva.value = '__NUEVA__';
      optNueva.textContent = '+ Agregar nueva categoría...';
      categoriaSelect.appendChild(optNueva);

      if (categoriasUnicas.length === 0 || (categoriaSeleccionada && !categoriasUnicas.includes(categoriaSeleccionada))) {
        if (categoriaSeleccionada) {
          const optCustom = document.createElement('option');
          optCustom.value = categoriaSeleccionada;
          optCustom.textContent = categoriaSeleccionada;
          optCustom.selected = true;
          categoriaSelect.insertBefore(optCustom, categoriaSelect.firstChild);
        }
      }

      manejarCambioSelector();
    }

    function manejarCambioSelector() {
      if (categoriaSelect.value === '__NUEVA__') {
        nuevaCategoriaContainer.style.display = 'flex';
        categoriaNuevaInput.required = true;
        categoriaNuevaInput.focus();
      } else {
        nuevaCategoriaContainer.style.display = 'none';
        categoriaNuevaInput.required = false;
        categoriaNuevaInput.value = '';
      }
    }

    categoriaSelect.addEventListener('change', manejarCambioSelector);

    // Control de Apertura y Cierre de Modal
    openModalBtn.addEventListener('click', () => {
      resetearFormulario();
      actualizarSelectorCategorias();
      modalOverlay.classList.add('is-open');
    });

    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('is-open'));
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('is-open');
    });

    function resetearFormulario() {
      menuForm.reset();
      editDocIdInput.value = '';
      nuevaCategoriaContainer.style.display = 'none';
      modalTitle.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Nueva Página de Menú`;
      submitBtnTxt.textContent = "Guardar Página en Menú";
    }

    // 1. Guardar o Actualizar desde el Modal
    menuForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const docId = editDocIdInput.value;
      
      let categoriaFinal = categoriaSelect.value;
      if (categoriaFinal === '__NUEVA__') {
        categoriaFinal = categoriaNuevaInput.value.trim() || 'General';
      }

      const dataItem = {
        Nombre: nombreInput.value.trim(),
        Redireccion: redireccionInput.value.trim(),
        Categoria: categoriaFinal,
        LOGOTIPO: logotipoInput.value.trim()
      };

      try {
        const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");

        if (docId) {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", docId);
          await updateDoc(docRef, dataItem);
        } else {
          dataItem.orden = menuCacheGlobal.length;
          await addDoc(menuRef, dataItem);
        }

        localStorage.removeItem('cout_menu_cache');
        modalOverlay.classList.remove('is-open');
        resetearFormulario();
      } catch (err) {
        console.error("Error al guardar:", err);
        alert("Ocurrió un error al guardar.");
      }
    });

    // 2. Abrir Modal para Editar
    window.cargarParaEditar = (id) => {
      const item = menuCacheGlobal.find(m => m.id === id);
      if (!item) return;

      editDocIdInput.value = item.id;
      nombreInput.value = item.Nombre || '';
      redireccionInput.value = item.Redireccion || '';
      logotipoInput.value = item.LOGOTIPO || '';
      
      const catActual = item.Categoria || item.categoria || 'General';
      actualizarSelectorCategorias(catActual);

      modalTitle.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Editar: ${item.Nombre}`;
      submitBtnTxt.textContent = "Actualizar Cambios";
      modalOverlay.classList.add('is-open');
    };

    // 3. Eliminar Ítem
    window.eliminarItemMenu = async (id) => {
      if (confirm("¿Está seguro de eliminar esta página del menú?")) {
        try {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", id);
          await deleteDoc(docRef);
          localStorage.removeItem('cout_menu_cache');
        } catch (err) {
          console.error("Error al eliminar:", err);
        }
      }
    };

    // 4. Reubicar Posición de Página Individual
    window.cambiarPosicionItem = async (id, direccion) => {
      const index = menuCacheGlobal.findIndex(m => m.id === id);
      if (index === -1) return;

      const nuevoIndex = index + direccion;
      if (nuevoIndex < 0 || nuevoIndex >= menuCacheGlobal.length) return;

      const temp = menuCacheGlobal[index];
      menuCacheGlobal[index] = menuCacheGlobal[nuevoIndex];
      menuCacheGlobal[nuevoIndex] = temp;

      try {
        for (let i = 0; i < menuCacheGlobal.length; i++) {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", menuCacheGlobal[i].id);
          await updateDoc(docRef, { orden: i });
        }
        localStorage.removeItem('cout_menu_cache');
      } catch (err) {
        console.error("Error al reordenar ítem:", err);
      }
    };

    // 5. Reubicar Categoría Completa
    window.cambiarPosicionCategoria = async (catName, direccion) => {
      const catsOrdenadas = [];
      menuCacheGlobal.forEach(item => {
        const cat = item.Categoria || item.categoria || 'General';
        if (!catsOrdenadas.includes(cat)) catsOrdenadas.push(cat);
      });

      const catIndex = catsOrdenadas.indexOf(catName);
      if (catIndex === -1) return;

      const nuevoCatIndex = catIndex + direccion;
      if (nuevoCatIndex < 0 || nuevoCatIndex >= catsOrdenadas.length) return;

      const tempCat = catsOrdenadas[catIndex];
      catsOrdenadas[catIndex] = catsOrdenadas[nuevoCatIndex];
      catsOrdenadas[nuevoCatIndex] = tempCat;

      let nuevoOrdenGlobal = [];
      catsOrdenadas.forEach(c => {
        const itemsDeCat = menuCacheGlobal.filter(item => (item.Categoria || item.categoria || 'General') === c);
        nuevoOrdenGlobal = nuevoOrdenGlobal.concat(itemsDeCat);
      });

      try {
        for (let i = 0; i < nuevoOrdenGlobal.length; i++) {
          const docRef = doc(db, "carpetacout", "configuracion_general", "menuprestamistas", nuevoOrdenGlobal[i].id);
          await updateDoc(docRef, { orden: i });
        }
        localStorage.removeItem('cout_menu_cache');
      } catch (err) {
        console.error("Error al reordenar categoría:", err);
      }
    };

    // 6. Listener en tiempo real de Firestore
    const menuRef = collection(db, "carpetacout", "configuracion_general", "menuprestamistas");

    onSnapshot(menuRef, (snapshot) => {
      menuGroupedContainer.innerHTML = '';
      const items = [];

      snapshot.forEach((docSnap) => {
        items.push({ id: docSnap.id, ...docSnap.data() });
      });

      items.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
      menuCacheGlobal = items;

      if (items.length === 0) {
        menuGroupedContainer.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); padding: 40px; font-size: 13px;">No hay páginas configuradas. Utilice el botón superior para agregar una.</div>';
        return;
      }

      const categoriasMap = {};
      items.forEach((item) => {
        const cat = item.Categoria || item.categoria || 'General';
        if (!categoriasMap[cat]) categoriasMap[cat] = [];
        categoriasMap[cat].push(item);
      });

      Object.keys(categoriasMap).forEach((catName) => {
        const groupBlock = document.createElement('div');
        groupBlock.className = 'category-group-block';

        const groupHeader = document.createElement('div');
        groupHeader.className = 'category-group-header';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'category-group-title';
        groupTitle.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 9h16M4 15h16"/></svg> ${catName}`;
        
        const catActions = document.createElement('div');
        catActions.className = 'category-actions';
        catActions.innerHTML = `
          <button class="btn-action" onclick="window.cambiarPosicionCategoria('${catName}', -1)" title="Mover categoría arriba">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </button>
          <button class="btn-action" onclick="window.cambiarPosicionCategoria('${catName}', 1)" title="Mover categoría abajo">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        `;

        groupHeader.appendChild(groupTitle);
        groupHeader.appendChild(catActions);
        groupBlock.appendChild(groupHeader);

        categoriasMap[catName].forEach((navItem) => {
          const row = document.createElement('div');
          row.className = 'menu-item-row';

          const nombre = navItem.Nombre || navItem.nombre || 'Sin título';
          const redireccion = navItem.Redireccion || navItem.redireccion || '#';
          const svgCode = navItem.LOGOTIPO || navItem.logotipo || '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>';

          row.innerHTML = `
            <div class="item-info">
              <div class="item-svg-preview">${svgCode}</div>
              <div class="item-details">
                <h4>${nombre}</h4>
                <div class="meta-text">${redireccion}</div>
              </div>
            </div>
            <div class="item-actions">
              <button class="btn-action" onclick="window.cambiarPosicionItem('${navItem.id}', -1)" title="Mover página arriba">
                <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
              </button>
              <button class="btn-action" onclick="window.cambiarPosicionItem('${navItem.id}', 1)" title="Mover página abajo">
                <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <button class="btn-action" onclick="window.cargarParaEditar('${navItem.id}')" title="Editar página">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="btn-action delete" onclick="window.eliminarItemMenu('${navItem.id}')" title="Eliminar página">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          `;

          groupBlock.appendChild(row);
        });

        menuGroupedContainer.appendChild(groupBlock);
      });
    });
  </script>
</body>
</html>
