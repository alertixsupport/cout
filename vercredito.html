<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Consulta de Crédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #05070b;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .portal-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .portal-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-flame), transparent);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-header h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-header h1 span {
      color: var(--accent-flame);
    }

    .brand-header p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ESTADO DEL CRÉDITO */
    .status-banner {
      background: rgba(249, 115, 22, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.25);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .status-banner .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .status-banner .val {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .val.activo { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .val.moroso { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .val.finalizado { background: rgba(100, 116, 139, 0.15); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    /* TABLA DE RESUMEN */
    .details-table {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .detail-row .lbl { color: var(--text-tertiary); font-weight: 600; }
    .detail-row .val { color: var(--text-primary); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    /* SECCIÓN CUOTAS */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .cuotas-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 18px;
      padding-right: 4px;
    }

    .cuota-item {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cuota-info .num { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .cuota-info .fec { font-size: 11px; color: var(--text-tertiary); }

    .cuota-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cuota-tag.pagada { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .cuota-tag.pendiente { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* FIRMA DIGITAL */
    .signature-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .signature-box img {
      max-width: 100%;
      max-height: 90px;
      object-fit: contain;
    }

    .loading-state, .error-state {
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="portal-container" id="portalContainer">
    <div class="loading-state" id="loadingState">Cargando información segura del crédito...</div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const creditoId = urlParams.get('id');
    const prestamistaId = urlParams.get('p');

    const portalContainer = document.getElementById('portalContainer');

    async function cargarPortal() {
      if (!creditoId || !prestamistaId) {
        portalContainer.innerHTML = '<div class="error-state" style="color: #ef4444;">Enlace de seguimiento inválido o incompleto.</div>';
        return;
      }

      try {
        // Obtener Crédito
        const creditoRef = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos", creditoId);
        const credSnap = await getDoc(creditoRef);

        if (!credSnap.exists()) {
          portalContainer.innerHTML = '<div class="error-state" style="color: #ef4444;">No se encontró el registro del crédito solicitado.</div>';
          return;
        }

        const cred = credSnap.data();

        // Obtener Cliente para la Firma
        let firmaImg = '';
        if (cred.clienteId) {
          const clienteRef = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "clientes", cred.clienteId);
          const cliSnap = await getDoc(clienteRef);
          if (cliSnap.exists()) {
            firmaImg = cliSnap.data().firmaDigital || '';
          }
        }

        // Generar Cuotas si no existen en el documento
        let cuotasArr = cred.cuotasDetalle || [];
        if (cuotasArr.length === 0) {
          const valorCuota = cred.valorCuota || (cred.totalConInteres / cred.cantidadCuotas);
          let fechaBase = new Date(cred.fechaInicio || Date.now());
          for (let i = 1; i <= cred.cantidadCuotas; i++) {
            if (cred.frecuencia === 'semanal') fechaBase.setDate(fechaBase.getDate() + 7);
            else if (cred.frecuencia === 'quincenal') fechaBase.setDate(fechaBase.getDate() + 15);
            else if (cred.frecuencia === 'mensual') fechaBase.setMonth(fechaBase.getMonth() + 1);

            cuotasArr.push({
              numero: i,
              vencimiento: fechaBase.toISOString().split('T')[0],
              monto: valorCuota,
              pagada: false
            });
          }
        }

        let cuotasHtml = '';
        cuotasArr.forEach(cuota => {
          cuotasHtml += `
            <div class="cuota-item">
              <div class="cuota-info">
                <span class="num">Cuota #${cuota.numero} - $${cuota.monto.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
                <span class="fec">Vencimiento: ${cuota.vencimiento}</span>
              </div>
              <span class="cuota-tag ${cuota.pagada ? 'pagada' : 'pendiente'}">${cuota.pagada ? 'PAGADA' : 'PENDIENTE'}</span>
            </div>
          `;
        });

        portalContainer.innerHTML = `
          <div class="brand-header">
            <h1>cout<span>.app</span></h1>
            <p>Portal de Seguimiento de Crédito</p>
          </div>

          <div class="status-banner">
            <div>
              <span class="label">Titular</span>
              <div style="font-size: 14px; font-weight: 800; margin-top: 2px;">${cred.clienteNombre || 'Cliente'}</div>
            </div>
            <div>
              <span class="label">Estado</span>
              <div style="margin-top: 2px;"><span class="val ${cred.estado || 'activo'}">${cred.estado || 'activo'}</span></div>
            </div>
          </div>

          <div class="details-table">
            <div class="detail-row"><span class="lbl">Tipo de Operación:</span><span class="val" style="text-transform: uppercase;">${cred.tipoCredito}</span></div>
            <div class="detail-row"><span class="lbl">Monto Principal:</span><span class="val">$${(cred.montoPrincipal || 0).toLocaleString('es-AR')}</span></div>
            <div class="detail-row"><span class="lbl">Total con Interés:</span><span class="val">$${(cred.totalConInteres || 0).toLocaleString('es-AR')}</span></div>
            <div class="detail-row"><span class="lbl">Modalidad:</span><span class="val" style="text-transform: uppercase;">${cred.frecuencia}</span></div>
            <div class="detail-row"><span class="lbl">Cantidad de Cuotas:</span><span class="val">${cred.cantidadCuotas} cuota(s)</span></div>
          </div>

          ${cred.tipoCredito === 'producto' ? `
            <div class="details-table">
              <div class="detail-row"><span class="lbl">Producto:</span><span class="val">${cred.productoTitulo || 'N/D'}</span></div>
              <div class="detail-row"><span class="lbl">Descripción:</span><span class="val">${cred.productoDescripcion || '-'}</span></div>
            </div>
          ` : ''}

          <div class="section-title">Cronograma de Cuotas</div>
          <div class="cuotas-container">
            ${cuotasHtml}
          </div>

          <div class="section-title">Firma Digital Registrada</div>
          <div class="signature-box">
            ${firmaImg ? `<img src="${firmaImg}" alt="Firma Digital">` : `<span style="font-size: 12px; color: var(--text-tertiary);">Pendiente de firma digital</span>`}
          </div>
        `;

      } catch (err) {
        console.error(err);
        portalContainer.innerHTML = '<div class="error-state" style="color: #ef4444;">Error al cargar los datos del crédito.</div>';
      }
    }

    cargarPortal();
  </script>
</body>
</html>
