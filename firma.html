<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Firma Digital de Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    .firma-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      text-align: center;
    }

    h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    h2 span { color: var(--accent-flame); }
    p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

    .signature-pad-container {
      position: relative;
      width: 100%;
      height: 220px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 2px dashed rgba(249, 115, 22, 0.4);
      margin-bottom: 16px;
      touch-action: none;
    }

    canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

    .actions { display: flex; gap: 10px; }
    
    .btn-clear {
      flex: 1; height: 44px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-subtle);
      color: var(--text-primary); border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;
    }

    .btn-save {
      flex: 1; height: 44px; background: linear-gradient(135deg, #ea580c 0%, #f97316 100%); border: none;
      color: white; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="firma-card">
    <h2>Firma Digital <span>COUT.APP</span></h2>
    <p id="clientNameTitle">Firme en el recuadro inferior para validar su crédito:</p>

    <div class="signature-pad-container">
      <canvas id="signatureCanvas"></canvas>
    </div>

    <div class="actions">
      <button class="btn-clear" id="clearBtn">Limpiar</button>
      <button class="btn-save" id="saveBtn">Guardar Firma</button>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');
    const prestamistaId = urlParams.get('p');

    if (!clientId || !prestamistaId) {
      document.body.innerHTML = '<div style="text-align:center; color:#ef4444; font-weight:700; padding:20px;">Enlace de firma incompleto o inválido.</div>';
    } else {
      // Opcional: Validar que el cliente exista en Firestore al abrir la página
      const clienteRef = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "clientes", clientId);
      getDoc(clienteRef).then(docSnap => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.nombre) {
            document.getElementById('clientNameTitle').textContent = `Cliente: ${data.nombre}. Por favor, firme en el recuadro:`;
          }
        }
      }).catch(err => console.log("Verificación previa omitida", err));
    }

    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function ajustarCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', ajustarCanvas);
    ajustarCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke(); });
    canvas.addEventListener('mouseup', () => isDrawing = false);

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke(); e.preventDefault(); });
    canvas.addEventListener('touchend', () => isDrawing = false);

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = "Guardando...";
      saveBtn.disabled = true;

      const dataURL = canvas.toDataURL('image/png');
      try {
        const clientRef = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "clientes", clientId);
        await updateDoc(clientRef, { firmaDigital: dataURL });
        document.body.innerHTML = '<div style="text-align:center; color:#10b981; font-weight:700; padding:40px; font-size:16px;">¡Firma guardada con éxito!<br><span style="font-size:13px; color:#94a3b8; font-weight:400;">Ya puede cerrar esta ventana y regresar a la aplicación.</span></div>';
      } catch (err) {
        console.error(err);
        alert("Error al guardar la firma en el servidor.");
        saveBtn.textContent = "Guardar Firma";
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
