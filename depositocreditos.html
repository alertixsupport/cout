<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COUT.APP | Depósito de Créditos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0e121d;
      --bg-surface-hover: #161d2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #f97316;
      --accent-flame: #f97316;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }

    /* Navbar Principal */
    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.3);
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo-text span {
      color: var(--accent-flame);
    }

    /* Panel Hero */
    .dashboard-hero {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-text-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hero-text h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 2px;
    }

    .hero-text h1 span {
      color: var(--accent-flame);
    }

    .hero-text p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* BADGE CONTADOR */
    .credit-counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-flame);
      font-family: 'JetBrains Mono', monospace;
    }

    .credit-counter-badge svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    /* BUSCADOR COMPACTO */
    .search-container {
      margin-bottom: 20px;
      width: 100%;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    @media (min-width: 768px) {
      .search-input-wrapper {
        max-width: 340px;
      }
    }

    .search-input-wrapper svg.search-icon {
      position: absolute;
      left: 14px;
      width: 15px;
      height: 15px;
      stroke: var(--text-tertiary);
      fill: none;
      stroke-width: 2;
      pointer-events: none;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 9px 14px 9px 38px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .search-input-wrapper input:focus {
      border-color: var(--accent-flame);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
    }

    /* GRID Y CARDS DE CRÉDITOS */
    .credits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .credits-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .credits-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .credit-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      position: relative;
    }

    .credit-card:hover {
      transform: translateY(-3px);
      border-color: rgba(249, 115, 22, 0.4);
      background: var(--bg-surface-hover);
    }

    .credit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .client-name-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .status-badge.activo { background: rgba(16, 185, 129, 0.12); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-badge.moroso { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-badge.finalizado { background: rgba(100, 116, 139, 0.12); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }

    .credit-compact-data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px;
    }

    .data-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .data-item .lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .data-item .val {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
    }

    .credit-card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
    }

    .btn-action-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-action-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .btn-action-icon.share { color: #60a5fa; }
    .btn-action-icon.moroso { color: #f59e0b; }

    .btn-action-icon svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .btn-pay-compact {
      flex: 1;
      height: 34px;
      background: rgba(249, 115, 22, 0.12);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 8px;
      color: var(--accent-flame);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-pay-compact:hover {
      background: rgba(249, 115, 22, 0.25);
    }

    /* MODALES Y VENTANAS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.85);
      backdrop-filter: blur(12px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 100%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-header h3 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close-modal {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-close-modal svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .modal-body-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    /* ESTILOS FICHA TÉCNICA DEL CRÉDITO (OJITO) */
    .profile-card-view {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-details-table {
      width: 100%;
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 6px;
      font-size: 13px;
    }

    .profile-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .profile-row .lbl { color: var(--text-tertiary); font-weight: 600; }
    .profile-row .val { color: var(--text-primary); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    .signature-preview-box {
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .signature-preview-box img { max-width: 100%; max-height: 100px; object-fit: contain; }

    /* TABLA DE CUOTAS */
    .cuotas-table-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cuota-row-item {
      background: #090e18;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cuota-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cuota-info .num { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .cuota-info .fec { font-size: 11px; color: var(--text-tertiary); }

    .cuota-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cuota-status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .cuota-status-tag.pagada { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .cuota-status-tag.pendiente { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }

    .btn-pagar-cuota {
      background: var(--accent-flame);
      border: none;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Modal Alerta Profesional */
    .custom-alert-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.88);
      backdrop-filter: blur(12px);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .custom-alert-overlay.is-open { opacity: 1; pointer-events: auto; }

    .custom-alert-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }

    .custom-alert-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
    }

    .custom-alert-icon svg { width: 22px; height: 22px; stroke: var(--accent-flame); fill: none; stroke-width: 2; }
    .custom-alert-box h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .custom-alert-box p { font-size: 13px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 18px; }
    .btn-alert-primary { width: 100%; height: 40px; background: var(--accent-flame); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- MODAL DE ALERTA -->
  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <div class="custom-alert-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      </div>
      <h4 id="alertTitle">Atención</h4>
      <p id="alertMessage">Mensaje del sistema...</p>
      <button class="btn-alert-primary" id="alertOkBtn">Aceptar</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="gestionprestamista.html" class="btn-back">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver al Panel
      </a>

      <div class="brand-section">
        <h1 class="logo-text">cout<span>.app</span></h1>
      </div>
    </header>

    <main>
      <div class="dashboard-hero">
        <div class="hero-text-wrapper">
          <div class="hero-text">
            <h1>Depósito de <span>Créditos</span></h1>
            <p>Control de cartera, estado de cuotas y gestión en tiempo real.</p>
          </div>
          <!-- CONTADOR DE CRÉDITOS -->
          <div class="credit-counter-badge" title="Total de créditos brindados">
            <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
            <span id="creditCounter">0</span>
          </div>
        </div>
      </div>

      <!-- BUSCADOR COMPACTO EN TIEMPO REAL -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar por cliente, tipo de crédito...">
          <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <!-- CARDS DE CRÉDITOS -->
      <div class="credits-grid" id="creditsGrid"></div>
    </main>
  </div>

  <!-- MODAL: FICHA TÉCNICA DEL CRÉDITO (OJITO) -->
  <div class="modal-overlay" id="viewModalOverlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitleView">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-flame)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          Ficha del Crédito
        </h3>
        <button class="btn-close-modal" id="closeViewModalBtn">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="modal-body-scroll">
        <div class="profile-card-view" id="profileCardContent"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { collection, doc, updateDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const prestamistaId = localStorage.getItem('cout_prestamista_id');
    const usuarioLogueado = localStorage.getItem('cout_prestamista_user');

    if (!prestamistaId || !usuarioLogueado) {
      window.location.replace('loginprestamista.html');
    }

    let creditosCacheGlobal = [];
    let clientesCacheGlobal = {};

    window.mostrarAlerta = (titulo, mensaje, callback = null) => {
      const overlay = document.getElementById('customAlertOverlay');
      document.getElementById('alertTitle').textContent = titulo;
      document.getElementById('alertMessage').textContent = mensaje;
      overlay.classList.add('is-open');
      document.getElementById('alertOkBtn').onclick = () => {
        overlay.classList.remove('is-open');
        if (callback) callback();
      };
    };

    const viewModalOverlay = document.getElementById('viewModalOverlay');
    const closeViewModalBtn = document.getElementById('closeViewModalBtn');
    const profileCardContent = document.getElementById('profileCardContent');
    const creditsGrid = document.getElementById('creditsGrid');
    const creditCounter = document.getElementById('creditCounter');
    const searchInput = document.getElementById('searchInput');

    closeViewModalBtn.addEventListener('click', () => viewModalOverlay.classList.remove('is-open'));
    viewModalOverlay.addEventListener('click', (e) => { if (e.target === viewModalOverlay) viewModalOverlay.classList.remove('is-open'); });

    // Cargar caché de clientes para extraer firmas
    const cacheClientes = localStorage.getItem(`cout_clientes_cache_${prestamistaId}`);
    if (cacheClientes) {
      try {
        const arr = JSON.parse(cacheClientes);
        arr.forEach(c => { clientesCacheGlobal[c.id] = c; });
      } catch(e) { console.error(e); }
    }

    // Compartir link de seguimiento del crédito
    window.compartirCredito = (id) => {
      const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const link = `${basePath}vercredito.html?id=${id}&p=${prestamistaId}`;
      navigator.clipboard.writeText(link).then(() => {
        window.mostrarAlerta("Enlace Copiado", "El enlace de seguimiento del crédito fue copiado. Compártelo con el cliente.");
      });
    };

    // Cambiar a Moroso
    window.marcarMoroso = async (id) => {
      try {
        const ref = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos", id);
        await updateDoc(ref, { estado: 'moroso' });
        window.mostrarAlerta("Actualizado", "El crédito ha sido marcado como Moroso.");
      } catch(err) {
        console.error(err);
      }
    };

    // Renderizar listado de créditos
    function renderizarCreditos(arrayCreditos) {
      creditsGrid.innerHTML = '';
      creditCounter.textContent = creditosCacheGlobal.length;

      if (!arrayCreditos || arrayCreditos.length === 0) {
        creditsGrid.innerHTML = '<div style="text-align: center; color: var(--text-tertiary); grid-column: 1/-1; padding: 40px; font-size: 13px;">No hay créditos registrados en el depósito.</div>';
        return;
      }

      arrayCreditos.forEach((c) => {
        const id = c.id;
        const estado = c.estado || 'activo';
        const tipoLabel = c.tipoCredito === 'producto' ? 'Prod. Financiado' : 'Préstamo';

        const card = document.createElement('div');
        card.className = 'credit-card';

        card.innerHTML = `
          <div class="credit-header">
            <span class="client-name-title">${c.clienteNombre || 'Cliente'}</span>
            <span class="status-badge ${estado}">${estado}</span>
          </div>

          <div class="credit-compact-data">
            <div class="data-item">
              <span class="lbl">Tipo / Monto</span>
              <span class="val">$${(c.totalConInteres || 0).toLocaleString('es-AR')}</span>
            </div>
            <div class="data-item">
              <span class="lbl">Cuotas</span>
              <span class="val">${c.cantidadCuotas} cuota(s)</span>
            </div>
          </div>

          <div class="credit-card-footer">
            <button class="btn-action-icon" onclick="window.verFichaCredito('${id}')" title="Ver Ficha y Cuotas (Ojito)">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>

            <button class="btn-action-icon share" onclick="window.compartirCredito('${id}')" title="Compartir Link de Seguimiento">
              <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>

            <button class="btn-action-icon moroso" onclick="window.marcarMoroso('${id}')" title="Marcar como Moroso">
              <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </button>

            <button class="btn-pay-compact" onclick="window.verFichaCredito('${id}')" title="Gestionar Cuotas">
              Abonar Cuota
            </button>
          </div>
        `;
        creditsGrid.appendChild(card);
      });
    }

    // Buscador en tiempo real
    function filtrarCreditos() {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) {
        renderizarCreditos(creditosCacheGlobal);
        return;
      }
      const filtrados = creditosCacheGlobal.filter(c => 
        (c.clienteNombre || '').toLowerCase().includes(q) || (c.tipoCredito || '').toLowerCase().includes(q)
      );
      renderizarCreditos(filtrados);
    }
    searchInput.addEventListener('input', filtrarCreditos);

    // Ver Ficha y Cuotas del Crédito (Ojito)
    window.verFichaCredito = (id) => {
      const c = creditosCacheGlobal.find(item => item.id === id);
      if (!c) return;

      const clienteInfo = clientesCacheGlobal[c.clienteId] || {};
      const firmaImg = clienteInfo.firmaDigital || '';

      // Generar o leer cuotas
      let cuotasArr = c.cuotasDetalle || [];
      if (cuotasArr.length === 0) {
        cuotasArr = [];
        const valorCuota = c.valorCuota || (c.totalConInteres / c.cantidadCuotas);
        let fechaBase = new Date(c.fechaInicio || Date.now());
        for (let i = 1; i <= c.cantidadCuotas; i++) {
          if (c.frecuencia === 'semanal') fechaBase.setDate(fechaBase.getDate() + 7);
          else if (c.frecuencia === 'quincenal') fechaBase.setDate(fechaBase.getDate() + 15);
          else if (c.frecuencia === 'mensual') fechaBase.setMonth(fechaBase.getMonth() + 1);

          cuotasArr.push({
            numero: i,
            vencimiento: fechaBase.toISOString().split('T')[0],
            monto: valorCuota,
            pagada: false
          });
        }
      }

      let cuotasHtml = '';
      cuotasArr.forEach((cuota, index) => {
        cuotasHtml += `
          <div class="cuota-row-item">
            <div class="cuota-info">
              <span class="num">Cuota #${cuota.numero} - $${cuota.monto.toLocaleString('es-AR', {minimumFractionDigits: 2})}</span>
              <span class="fec">Vence: ${cuota.vencimiento}</span>
            </div>
            <div class="cuota-actions">
              <span class="cuota-status-tag ${cuota.pagada ? 'pagada' : 'pendiente'}">${cuota.pagada ? 'PAGADA' : 'PENDIENTE'}</span>
              ${!cuota.pagada ? `<button class="btn-pagar-cuota" onclick="window.pagarCuota('${id}', ${index})">Abonar</button>` : ''}
            </div>
          </div>
        `;
      });

      profileCardContent.innerHTML = `
        <div class="profile-details-table">
          <div class="profile-row"><span class="lbl">Cliente:</span><span class="val">${c.clienteNombre}</span></div>
          <div class="profile-row"><span class="lbl">Tipo:</span><span class="val" style="text-transform: uppercase;">${c.tipoCredito}</span></div>
          <div class="profile-row"><span class="lbl">Monto Total:</span><span class="val">$${(c.totalConInteres || 0).toLocaleString('es-AR')}</span></div>
          <div class="profile-row"><span class="lbl">Frecuencia:</span><span class="val" style="text-transform: uppercase;">${c.frecuencia}</span></div>
          <div class="profile-row"><span class="lbl">Estado:</span><span class="val" style="text-transform: uppercase; color: var(--accent-flame);">${c.estado || 'activo'}</span></div>
        </div>

        ${c.tipoCredito === 'producto' ? `
          <div class="profile-details-table">
            <div class="profile-row"><span class="lbl">Producto:</span><span class="val">${c.productoTitulo || 'N/D'}</span></div>
            <div class="profile-row"><span class="lbl">Descripción:</span><span class="val">${c.productoDescripcion || '-'}</span></div>
          </div>
        ` : ''}

        <div style="width: 100%; text-align: left;">
          <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Desglose de Cuotas</span>
        </div>
        <div class="cuotas-table-container">
          ${cuotasHtml}
        </div>

        <div style="width: 100%; text-align: left; margin-top: 6px;">
          <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">Firma Digital del Cliente</span>
        </div>
        <div class="signature-preview-box">
          ${firmaImg ? `<img src="${firmaImg}" alt="Firma">` : `<span style="font-size: 12px; color: var(--text-tertiary);">Sin firma registrada</span>`}
        </div>
      `;

      viewModalOverlay.classList.add('is-open');
    };

    // Pagar Cuota individual en tiempo real
    window.pagarCuota = async (creditoId, cuotaIndex) => {
      const c = creditosCacheGlobal.find(item => item.id === creditoId);
      if (!c) return;

      let cuotasArr = c.cuotasDetalle || [];
      if (cuotasArr.length === 0) {
        const valorCuota = c.valorCuota || (c.totalConInteres / c.cantidadCuotas);
        let fechaBase = new Date(c.fechaInicio || Date.now());
        for (let i = 1; i <= c.cantidadCuotas; i++) {
          if (c.frecuencia === 'semanal') fechaBase.setDate(fechaBase.getDate() + 7);
          else if (c.frecuencia === 'quincenal') fechaBase.setDate(fechaBase.getDate() + 15);
          else if (c.frecuencia === 'mensual') fechaBase.setMonth(fechaBase.getMonth() + 1);

          cuotasArr.push({
            numero: i,
            vencimiento: fechaBase.toISOString().split('T')[0],
            monto: valorCuota,
            pagada: false
          });
        }
      }

      cuotasArr[cuotaIndex].pagada = true;

      try {
        const ref = doc(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos", creditoId);
        await updateDoc(ref, { cuotasDetalle: cuotasArr });
        window.mostrarAlerta("Pago Registrado", "La cuota ha sido marcada como pagada.");
        window.verFichaCredito(creditoId); // Actualizar modal
      } catch (err) {
        console.error(err);
      }
    };

    // Sincronización en tiempo real con Firestore
    const creditosRef = collection(db, "carpetacout", "configuracion_general", "usuariosprestamistas", prestamistaId, "creditos");
    onSnapshot(creditosRef, (snapshot) => {
      const arr = [];
      snapshot.forEach(docSnap => {
        arr.push({ id: docSnap.id, ...docSnap.data() });
      });
      creditosCacheGlobal = arr;
      filtrarCreditos();
    });
  </script>
</body>
</html>
